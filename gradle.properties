# Project-wide Gradle settings.
# For more details on configuring Gradle properties, visit
# https://docs.gradle.org/current/userguide/build_environment.html

android.useAndroidX=true
# litert and litert-api share the namespace com.google.ai.edge.litert, which
# fails the manifest merger under AGP 9's uniquePackageNames.
android.uniquePackageNames=false

# Build performance
org.gradle.caching=true
org.gradle.parallel=true

# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
