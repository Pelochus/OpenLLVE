# Project-wide Gradle settings.
# For more details on configuring Gradle properties, visit
# https://docs.gradle.org/current/userguide/build_environment.html

# AndroidX support
android.useAndroidX=true
# AGP 9.x: `android.uniquePackageNames` defaults to true, which fails the
# manifest merger because the `litert` and `litert-api` libraries (both from
# com.google.ai.edge.litert:litert:2.2.0) share the namespace
# `com.google.ai.edge.litert`. Opt out until upstream fixes it.
android.uniquePackageNames=false
# Note: `android.enableJetifier` was dropped for the AGP 9.x bump — Jetifier
# is deprecated in AGP 9 (default false, removed in AGP 10) and the app uses
# only AndroidX artifacts.

# Build performance
org.gradle.caching=true
org.gradle.parallel=true

# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
