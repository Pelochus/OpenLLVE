# gradle.properties

# Project-wide Gradle settings.
# For more details on configuring Gradle properties, visit https://docs.gradle.org/current/userguide/build_environment.html

# Specify the Gradle version to use
gradle.version=7.4.2

# Android SDK version
android.compileSdk=31
android.minSdk=21
android.targetSdk=31

# Kotlin version
kotlin.version=1.6.10

# Enable or disable specific features
android.useAndroidX=true
android.enableJetifier=true

# Configure the build cache
org.gradle.caching=true

# Configure the JVM arguments for Gradle
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -Dfile.encoding=UTF-8

# Enable parallel builds
org.gradle.parallel=true

# Configure the build scan
org.gradle.scan=true