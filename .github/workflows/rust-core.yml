name: Rust Core CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned to the then-current dtolnay/rust-toolchain@stable commit
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Run Rust tests
        run: cargo test --manifest-path core/Cargo.toml
      - name: Run Clippy (deny warnings)
        run: cargo clippy --manifest-path core/Cargo.toml -- -D warnings
      - name: Check formatting
        run: cargo fmt --manifest-path core/Cargo.toml --check
      # The JNI shim (bridge/android) is the other Rust build: its frames.rs
      # boundary checks gate like the core.
      - name: Run bridge tests
        run: cargo test --manifest-path bridge/android/Cargo.toml
      - name: Run bridge Clippy (deny warnings)
        run: >-
          cargo clippy --manifest-path bridge/android/Cargo.toml
          -- -D warnings
      - name: Check bridge formatting
        run: cargo fmt --manifest-path bridge/android/Cargo.toml --check
