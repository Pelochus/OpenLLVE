name: Model Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install TensorFlow
        run: pip install tensorflow-cpu==2.16.1

      - name: Validate TensorFlow Lite Models
        run: |
          shopt -s nullglob
          model_dir=app/platforms/android/src/main/assets/models
          models=($model_dir/*.tflite)
          if [ ${#models[@]} -eq 0 ]; then
            echo "ERROR: no .tflite models found under $model_dir" >&2
            exit 1
          fi
          for model in "${models[@]}"; do
            echo "Validating model: $model"
            python scripts/validate_model.py "$model"
          done
