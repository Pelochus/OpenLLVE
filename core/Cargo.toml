[package]
name = "openllve-core"
version = "0.1.0"
edition = "2024"
authors = ["OpenLLVE Contributors"]
description = "High-performance agnostic core for real-time low-light video enhancement benchmarking"
license = "MIT"

[lib]
name = "openllve_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
bytemuck = "1.11"
thiserror = "1.0"

# TFLite runner (see docs/ARCHITECTURE.md §11). Optional: enabled by the `model` feature so the
# core still builds and tests without the TFLite runtime present.
tflite-c-rs = { version = "0.0.1", optional = true }

[features]
# Enables the in-Rust Zero-DCE model runner (`ModelRunner`). Requires
# `libtensorflowlite_c` at runtime (see `external/models/README.md` and
# `scripts/fetch-tflite-lib.sh`).
model = ["dep:tflite-c-rs"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "inference_bench"
harness = false

